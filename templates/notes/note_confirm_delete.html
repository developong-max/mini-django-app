{% extends "notes/base.html" %}
{% block title %}Delete note{% endblock %}
{% block content %}
    <div class="card">
        <p>Are you sure you want to delete <strong>{{ note.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button class="button danger" type="submit">Yes, delete it</button>
            <a class="button" href="{% url 'note_detail' note.pk %}">Cancel</a>
        </form>
    </div>
{% endblock %}
